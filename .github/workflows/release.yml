# Release
#
# Every push to main uploads an iOS build and a macOS build of Vowel Practice
# to TestFlight and distributes both to the internal group. Release Please
# opens a pull request when fix:, feat:, or BREAKING CHANGE: commits are
# waiting. Merging that pull request submits both platforms for App Store
# review.
#
# Adapted from swift-app-template release 1.1.0:
# https://github.com/fulldecent/swift-app-template/blob/v1.1.0/.github/workflows/release.yml
# The secrets context is not available in a job-level if, so a check job
# records whether APP_STORE_CONNECT_KEY_ID is present. The upload jobs run
# when that secret is set. The App Store job generates screenshots and uploads
# the text in fastlane/metadata and fastlane/metadata-macos. Review uses the
# version TestFlight uploaded, including an uncommitted next patch when the
# live train is closed.
#
# Release Please writes VERSION, the MARKETING_VERSION lines marked
# x-release-please-version, and CHANGELOG.md. The tag is v<version>.
# skip-github-release is set because this workflow creates the tag after the
# App Store submission succeeds. The build number is chosen at upload time and
# is not committed.
#
# Setup is in the repository README.

name: Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to submit for App Store review, for example v1.0.0. Leave empty to upload this commit to TestFlight only.
        required: false
        type: string
      screenshots:
        description: Generate screenshots and upload them for iOS and Mac. Does not submit for review.
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  propose:
    name: Open or update the release pull request
    if: github.event_name == 'push' || inputs.tag == ''
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.merged.outputs.pr }}
      tag_name: ${{ steps.merged.outputs.tag_name }}
    steps:
      # The default token is intentional. A pull request opened by this
      # action does not start pull_request workflows until that run is
      # approved. README.md describes that approval. This repository does
      # not add a personal access token for Release Please.
      - name: Open the release pull request
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Find a merged release pull request
        id: merged
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '
            .[] | select(.merged_at != null and any(.labels[]; .name == "autorelease: pending"))
            | "\(.number) v\(.title | capture("release (?<v>[0-9]+[.][0-9]+[.][0-9]+)").v)"' | head -n 1)
          if [ -n "$found" ]; then
            read -r pr tag <<< "$found"
            echo "pr=$pr" >> "$GITHUB_OUTPUT"
            echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Build and test
    needs: propose
    if: always() && (needs.propose.result == 'success' || needs.propose.result == 'skipped')
    uses: ./.github/workflows/build-test.yml

  apple:
    name: Check App Store secrets
    needs: test
    if: always() && needs.test.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Record whether the API key is configured
        id: check
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          if [ -n "$KEY_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "App Store jobs are skipped until APP_STORE_CONNECT_KEY_ID is set. The names are in README.md."
          fi

  testflight:
    name: Upload to TestFlight
    needs: [propose, test, apple]
    if: always() && needs.test.result == 'success' && needs.apple.outputs.ready == 'true'
    runs-on: xcode-27
    timeout-minutes: 120
    outputs:
      version: ${{ steps.ship.outputs.version }}
      build_number: ${{ steps.ship.outputs.build_number }}
    steps:
      - name: Check out this commit
        uses: actions/checkout@v7

      - name: Check signing secrets
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          P12: ${{ secrets.APP_STORE_DISTRIBUTION_P12 }}
          P12_PASSWORD: ${{ secrets.APP_STORE_DISTRIBUTION_P12_PASSWORD }}
          INSTALLER_P12: ${{ secrets.APP_STORE_MAC_INSTALLER_P12 }}
          INSTALLER_P12_PASSWORD: ${{ secrets.APP_STORE_MAC_INSTALLER_P12_PASSWORD }}
        run: |
          missing=0
          [ -n "$KEY_ID" ] || { echo "Missing secret APP_STORE_CONNECT_KEY_ID" >&2; missing=1; }
          [ -n "$ISSUER_ID" ] || { echo "Missing secret APP_STORE_CONNECT_ISSUER_ID" >&2; missing=1; }
          [ -n "$KEY" ] || { echo "Missing secret APP_STORE_CONNECT_KEY" >&2; missing=1; }
          [ -n "$P12" ] || { echo "Missing secret APP_STORE_DISTRIBUTION_P12" >&2; missing=1; }
          [ -n "$P12_PASSWORD" ] || { echo "Missing secret APP_STORE_DISTRIBUTION_P12_PASSWORD" >&2; missing=1; }
          [ -n "$INSTALLER_P12" ] || { echo "Missing secret APP_STORE_MAC_INSTALLER_P12" >&2; missing=1; }
          [ -n "$INSTALLER_P12_PASSWORD" ] || { echo "Missing secret APP_STORE_MAC_INSTALLER_P12_PASSWORD" >&2; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "The secret names are in README.md" >&2
            exit 1
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Import the distribution certificate
        env:
          P12_BASE64: ${{ secrets.APP_STORE_DISTRIBUTION_P12 }}
          P12_PASSWORD: ${{ secrets.APP_STORE_DISTRIBUTION_P12_PASSWORD }}
          INSTALLER_P12_BASE64: ${{ secrets.APP_STORE_MAC_INSTALLER_P12 }}
          INSTALLER_P12_PASSWORD: ${{ secrets.APP_STORE_MAC_INSTALLER_P12_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          echo "$INSTALLER_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security create-keychain -p "$P12_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/signing.keychain-db"
          security unlock-keychain -p "$P12_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security import "$RUNNER_TEMP/distribution.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/signing.keychain-db"
          security import "$RUNNER_TEMP/installer.p12" -P "$INSTALLER_P12_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/signing.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$P12_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/signing.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/signing.keychain-db"
          rm "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/installer.p12"

      - name: Write the App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8"
          KEY_ID="$KEY_ID" ISSUER_ID="$ISSUER_ID" KEY="$KEY" python3 - << 'PY'
          import json, os
          key_id = os.environ["KEY_ID"]
          json.dump({
              "key_id": key_id,
              "issuer_id": os.environ["ISSUER_ID"],
              "key": os.environ["KEY"],
              "key_filepath": os.environ["RUNNER_TEMP"] + f"/private_keys/AuthKey_{key_id}.p8",
              "in_house": False,
          }, open("fastlane/api_key.json", "w"))
          PY

      - name: Upload to TestFlight
        id: ship
        run: bundle exec fastlane ship_testflight

  screenshots:
    name: Generate screenshots
    needs: [propose, test, apple]
    if: |
      always() &&
      needs.test.result == 'success' &&
      needs.apple.outputs.ready == 'true' &&
      (needs.propose.outputs.tag_name != '' || (github.event_name == 'workflow_dispatch' && (inputs.tag != '' || inputs.screenshots)))
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Check out this commit
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Generate screenshots
        run: bundle exec fastlane generate_screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: app-store-screenshots
          path: fastlane/screenshots
          if-no-files-found: error
          retention-days: 7

  upload-screenshots:
    name: Upload screenshots
    needs: [apple, screenshots]
    if: |
      always() &&
      needs.apple.outputs.ready == 'true' &&
      needs.screenshots.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.screenshots &&
      inputs.tag == ''
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Check out this commit
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Download screenshots
        uses: actions/download-artifact@v8
        with:
          name: app-store-screenshots
          path: fastlane/screenshots

      - name: Write the App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8"
          KEY_ID="$KEY_ID" ISSUER_ID="$ISSUER_ID" KEY="$KEY" python3 - << 'PY'
          import json, os
          key_id = os.environ["KEY_ID"]
          json.dump({
              "key_id": key_id,
              "issuer_id": os.environ["ISSUER_ID"],
              "key": os.environ["KEY"],
              "key_filepath": os.environ["RUNNER_TEMP"] + f"/private_keys/AuthKey_{key_id}.p8",
              "in_house": False,
          }, open("fastlane/api_key.json", "w"))
          PY

      - name: Upload screenshots
        run: bundle exec fastlane upload_screenshots

  submit:
    name: Submit for App Store review
    needs: [propose, testflight, screenshots, apple]
    if: |
      always() &&
      needs.apple.outputs.ready == 'true' &&
      needs.testflight.result == 'success' &&
      needs.screenshots.result == 'success' &&
      (needs.propose.outputs.tag_name != '' || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out this commit
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Download screenshots
        uses: actions/download-artifact@v8
        with:
          name: app-store-screenshots
          path: fastlane/screenshots

      - name: Write the App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8"
          KEY_ID="$KEY_ID" ISSUER_ID="$ISSUER_ID" KEY="$KEY" python3 - << 'PY'
          import json, os
          key_id = os.environ["KEY_ID"]
          json.dump({
              "key_id": key_id,
              "issuer_id": os.environ["ISSUER_ID"],
              "key": os.environ["KEY"],
              "key_filepath": os.environ["RUNNER_TEMP"] + f"/private_keys/AuthKey_{key_id}.p8",
              "in_house": False,
          }, open("fastlane/api_key.json", "w"))
          PY

      - name: Resolve the tag
        id: tag
        env:
          TAG: ${{ inputs.tag || needs.propose.outputs.tag_name }}
        run: |
          case "$TAG" in
            v*.*.*) ;;
            *) echo "tag must look like v1.0.0" >&2; exit 1 ;;
          esac
          version=$(awk '{ print $1; exit }' VERSION)
          case "$TAG" in
            "v$version") ;;
            *) echo "tag $TAG does not match VERSION $version" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Submit for review
        env:
          BUILD_NUMBER: ${{ needs.testflight.outputs.build_number }}
          APP_VERSION: ${{ needs.testflight.outputs.version }}
        run: bundle exec fastlane submit_app_store "build_number:$BUILD_NUMBER" "version:$APP_VERSION"

  publish:
    name: Publish the GitHub release
    needs: [propose, test, apple, submit]
    if: |
      always() &&
      needs.test.result == 'success' &&
      needs.apple.result == 'success' &&
      (needs.propose.outputs.tag_name != '' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) &&
      (needs.apple.outputs.ready != 'true' || needs.submit.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out this commit
        uses: actions/checkout@v7

      - name: Resolve the tag
        id: tag
        env:
          TAG: ${{ inputs.tag || needs.propose.outputs.tag_name }}
        run: |
          case "$TAG" in
            v*.*.*) ;;
            *) echo "tag must look like v1.0.0" >&2; exit 1 ;;
          esac
          version=$(awk '{ print $1; exit }' VERSION)
          case "$TAG" in
            "v$version") ;;
            *) echo "tag $TAG does not match VERSION $version" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --latest

      - name: Mark the release pull request tagged
        if: needs.propose.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.propose.outputs.pr }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/autorelease:%20pending"
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" -f "labels[]=autorelease: tagged"
